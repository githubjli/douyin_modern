name: meow_media
description: Modern Flutter foundation inspired by Douyin UX patterns.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  video_player: ^2.11.1
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1
  flutter_riverpod: ^3.3.1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.0
  share_plus: ^13.1.0
  gal: ^2.3.2
  image_picker: ^1.2.2
  flutter_webrtc: ^1.4.1
  country_picker: ^2.0.26
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon_black.png
  remove_alpha_ios: true
